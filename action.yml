name: "GitHub Activity in README"
description: "Keep a README section in sync with your recent public GitHub activity."
author: "Ketan Dutt"

inputs:
  GH_USERNAME:
    description: "GitHub username, or a comma separated list of up to 10 usernames."
    default: "${{ github.repository_owner }}"
    required: false
  COMMIT_NAME:
    description: "Name of the git author/committer."
    default: "github-actions[bot]"
    required: false
  COMMIT_EMAIL:
    description: "Email of the git author/committer."
    default: "41898282+github-actions[bot]@users.noreply.github.com"
    required: false
  COMMIT_MSG:
    description: "Commit message used when the activity section changes."
    default: ":zap: Update README with the recent activity"
    required: false
  EMPTY_COMMIT_MSG:
    description: "Commit message used for the periodic empty commit."
    default: ":memo: Empty commit to keep the scheduled workflow active"
    required: false
  MAX_LINES:
    description: "Maximum number of activity lines to render (1-100)."
    default: "5"
    required: false
  TARGET_FILE:
    description: "Repository-relative path of the file to update."
    default: "README.md"
    required: false
  SECTION_NAME:
    description: "Section name used in the START/END markers. Defaults to activity."
    default: "activity"
    required: false
  FILTER_EVENTS:
    description: "Comma separated event types to show, or * for all supported events."
    default: "IssueCommentEvent,IssuesEvent,PullRequestEvent,ReleaseEvent"
    required: false
  EXCLUDE_REPOS:
    description: "Comma separated owner/repo glob patterns to hide (for example owner/*)."
    default: ""
    required: false
  SHOW_TIMESTAMPS:
    description: "Append a timestamp to each activity line."
    default: "false"
    required: false
  TIMESTAMP_FORMAT:
    description: "Timestamp style: date, datetime, or relative."
    default: "date"
    required: false
  EMPTY_COMMIT_DAYS:
    description: "Create an empty commit after this many days without commits. Set 0 to disable."
    default: "50"
    required: false
  DRY_RUN:
    description: "Render the activity and write a job summary without changing files or git history."
    default: "false"
    required: false
  GITHUB_TOKEN:
    description: "Optional token for reading public events. Defaults to the GITHUB_TOKEN environment variable."
    default: ""
    required: false

outputs:
  changed:
    description: "true when the target file was updated, false otherwise."
  activity_count:
    description: "Number of activity lines rendered in the section."
  target_file:
    description: "Repository-relative path that was managed."
  result:
    description: "One of: updated, unchanged, empty-commit, dry-run."
  commit_sha:
    description: "SHA of the pushed commit, when a commit was created."

branding:
  color: yellow
  icon: activity

runs:
  using: node24
  main: dist/index.js
